<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECOLIT HR Portal</title>
<meta name="description" content="Ecolit Ceiling Solutions — HR Portal: kadrlar bilan ishlashning zamonaviy tizimi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#2fb878;--g2:#1f9d63;--gl:#e7f6ee;--gl2:#d3efe0;--tx:#1d2733;--mu:#6b7785;--bd:#e8edf1;--bg:#f5f7f8;--card:#fff;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;background:#fff;border-right:1px solid var(--bd);padding:14px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{display:flex;justify-content:center;padding:10px 0 22px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#33404d;font-weight:500;margin-bottom:3px}
.nav a:hover{background:var(--gl)}
.nav a.on{background:var(--g);color:#fff;box-shadow:0 4px 12px rgba(47,184,120,.3)}
.nav .sub a{padding:8px 14px 8px 24px;font-size:13px;margin-left:8px;background:#f7f9fa}
.nav .sub a.on{background:var(--gl2);color:var(--g2);box-shadow:none}
.nav hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
.chev{margin-left:auto;width:16px!important;height:16px!important}
.promo{margin-top:auto;border-radius:14px;overflow:hidden;background:var(--gl);padding:18px 16px 80px;position:relative}
.promo p{font-size:13px;margin-top:10px;font-style:italic;color:#33404d}
.promo .bld{position:absolute;inset:auto 0 0 0;height:70px;background:url(img/sidebar.jpg) bottom/cover;opacity:.85;mask-image:linear-gradient(transparent,#000 40%)}
/* main */
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:18px;padding:16px 28px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.burger{display:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:#f1f4f6;border:1px solid var(--bd);border-radius:22px;padding:9px 16px}
.search input{border:0;background:none;outline:0;font:inherit;flex:1}
.bell{position:relative;margin-left:auto;color:#5a6672}
.bell b{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center}
.user{display:flex;align-items:center;gap:10px}
.user img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.user b{display:block;font-size:14px}.user small{color:var(--mu)}
.page{padding:22px 28px 40px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:190px;background:#eef3f2;display:flex;align-items:center}
.hero .ph{position:absolute;inset:0 0 0 38%;background:url(img/hero.jpg) center/cover}
.hero .ph:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f4f7f7 0%,rgba(244,247,247,.5) 25%,transparent 55%)}
.hero .l{position:relative;padding:26px 34px}
.hero .l i{display:block;font-size:20px;margin-top:10px;font-weight:500;color:#2a3540}
.hero .card{position:absolute;right:22px;top:50%;transform:translateY(-50%);background:rgba(47,184,120,.92);color:#fff;border-radius:14px;padding:18px 22px;max-width:250px}
.hero .card h2{font-size:24px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.box{background:var(--card);border-radius:var(--r);border:1px solid var(--bd);box-shadow:0 2px 10px rgba(20,40,60,.04)}
.stat{display:flex;align-items:center;gap:16px;padding:18px 20px}
.ic{width:52px;height:52px;border-radius:12px;background:var(--gl);color:var(--g2);display:grid;place-items:center;flex:none}
.ic svg.i{width:26px;height:26px}
.stat b{font-size:26px;display:block}
.stat span{color:var(--mu);font-size:13px}
.up{white-space:nowrap;color:var(--g2);font-size:12px;margin-left:6px;font-weight:600}
.grid3{display:grid;grid-template-columns:1fr 1.1fr 1.2fr;gap:16px}
.grid3b{display:grid;grid-template-columns:1.1fr 1.2fr 0.9fr;gap:16px;margin-top:16px}
.panel{padding:18px 20px}
.ph2{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ph2 h3{font-size:16px}
.ph2 .ic{width:30px;height:30px;border-radius:8px}.ph2 .ic svg.i{width:18px;height:18px}
.ph2 a{margin-left:auto;color:var(--g2);font-size:13px;font-weight:600}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;background:var(--gl);color:var(--g2);font-weight:600;padding:9px 18px;border-radius:20px;font-size:13px}
.btn:hover{background:var(--gl2)}
.btn.p{background:var(--g);color:#fff;padding:12px 26px;font-size:14px}.btn.p:hover{background:var(--g2)}
.donut{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.grid3>*,.grid3b>*{min-width:0}
.legend div{display:flex;align-items:center;gap:10px;margin:12px 0}
.legend i{width:9px;height:9px;border-radius:50%}
.legend b{margin-left:auto;padding-left:16px}
.vac{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
.vac:last-child{border:0}
.vac .ic{width:42px;height:42px}
.vac div b{display:block;font-size:13px}.vac div small{color:var(--mu)}
.vac .btn{margin-left:auto}
.steps{position:relative}
.st{display:flex;gap:14px;margin-bottom:16px;position:relative}
.st .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--g);color:var(--g2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;background:#fff;z-index:1}
.st.on .n{background:var(--g);color:#fff}
.st.off .n{border-color:#ccd3d9;color:#8a96a2;background:#eef1f3}
.st:not(:last-child):after{content:"";position:absolute;left:12px;top:28px;bottom:-16px;border-left:2px solid var(--gl2)}
.st b{display:block;font-size:13px}.st small{color:var(--mu);font-size:12px}
.new{display:flex;gap:10px}
.cv{flex:none;width:120px;height:140px;border-radius:16px;background:var(--gl);display:grid;place-items:center;position:relative}
.cv .sh{width:70px;height:92px;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:10px;transform:rotate(6deg)}
.cv .sh b{color:#5b7fd6;font-size:15px}
.cv .sh i{display:block;height:5px;background:#dfe6f2;border-radius:3px;margin-top:7px}
.cv .ok{position:absolute;right:12px;bottom:18px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center}
.comp{display:flex;gap:16px}
.comp img{width:140px;height:130px;object-fit:cover;border-radius:12px;flex:none}
.comp p{font-size:13px;line-height:1.55;color:#3a4652}
.nw{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--bd)}
.nw:last-child{border:0}
.nw img{width:78px;height:38px;object-fit:cover;border-radius:6px}
.nw span{flex:1;font-size:13px}.nw small{color:var(--mu);font-size:12px}
.prof{text-align:center}
.prof .row{display:flex;align-items:center;gap:14px;text-align:left}
.prof img{width:90px;height:90px;border-radius:50%;object-fit:cover}
.prof small{display:flex;gap:6px;align-items:center;color:var(--mu);margin-top:6px;font-size:12px}
.prof small svg.i{width:14px;height:14px}
.prof .btn{width:100%;justify-content:center;margin-top:16px}
/* inner pages */
h1.t{font-size:22px;margin-bottom:4px}.sub-t{color:var(--mu);margin-bottom:18px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;background:#fafbfc}
.tag{padding:3px 10px;border-radius:10px;font-size:12px;background:var(--gl);color:var(--g2);font-weight:500}
.tag.b{background:#eaf0ff;color:#4a6fd6}.tag.o{background:#fff3e3;color:#c47a12}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.inp,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;outline:0;width:100%}
.inp:focus,select:focus,textarea:focus{border-color:var(--g)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.form .f{grid-column:1/-1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.q{margin-bottom:18px}.q b{display:block;margin-bottom:8px}
.q label{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer}
.q label:hover{background:var(--gl)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);opacity:0;pointer-events:none;background:#1d2733;color:#fff;padding:12px 22px;border-radius:12px;transition:.3s;z-index:50}
.toast.s{transform:translateX(-50%) translateY(0);opacity:1}
.empty{color:var(--mu);padding:20px;text-align:center}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--mu)}
.qnav button.ans{background:var(--gl);color:var(--g2);border-color:var(--gl2)}
.qnav button.cur{outline:2px solid var(--g);color:var(--tx)}
.qt b{display:block;font-size:16px;line-height:1.45}.qt small{display:block;color:var(--mu);margin-top:4px;line-height:1.45}
.qimg{display:block;max-width:min(100%,600px);max-height:400px;margin:18px 0;border-radius:8px}
.seq{font-size:24px;font-weight:700;margin:20px 0;font-family:Georgia,serif}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px;max-width:620px}
.opt{border:2px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;transition:.15s}
.opt b{font-size:18px}.opt span{font-size:15px;color:var(--mu)}
.opt:hover{border-color:var(--g)}.opt.sel{border-color:var(--g);background:var(--gl)}.opt.sel span{color:var(--g2)}
.qctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
.thanks{text-align:center;padding:60px 24px;max-width:640px;margin:30px auto}
.thanks .tick{width:76px;height:76px;border-radius:50%;background:var(--g);color:#fff;font-size:40px;display:grid;place-items:center;margin:0 auto 22px}
.thanks h1{font-size:24px;margin-bottom:12px}.thanks p{color:var(--mu);margin-bottom:24px;line-height:1.6}
button:disabled{cursor:wait}
@media(max-width:820px){.opts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1200px){.grid3,.grid3b{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
 .side{position:fixed;left:-260px;z-index:20;transition:.25s;box-shadow:0 0 30px rgba(0,0,0,.15)}
 .side.open{left:0}.burger{display:block}
 .grid3,.grid3b,.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;gap:10px}.stat .ic{width:40px;height:40px}.comp{flex-direction:column}.comp img{width:100%!important}
 .user div,.search{display:none}.hero .card{display:none}.hero .ph{inset:0 0 0 45%}
 .page{padding:16px}.top{padding:12px 16px}
 .tblw{overflow-x:auto}
}
</style>
</head>

<script>
// ====== SOZLAMA: Google Apps Script "Web app URL" manzilini shu yerga qo'ying ======
const API_URL='BU_YERGA_APPS_SCRIPT_URL';
// ================================================================================
const I=(id,s='')=>`<svg class="i" ${s}><use href="#${id}"/></svg>`;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('s');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('s'),2600)}

 for(let t=0;t<3;t++){try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});return true}catch(e){await new Promise(r=>setTimeout(r,1500))}}
 return false}

 if(path==='/hodimlar'){const es=document.getElementById('es'),ed=document.getElementById('ed');const q0=document.getElementById('q').value;es.value=q0;
  const draw=()=>{const s=es.value.toLowerCase(),d=ed.value;const r=emps.filter(e=>(!d||e.d===d)&&(e.n+e.r).toLowerCase().includes(s));
   document.getElementById('eb').innerHTML=r.length?r.map(e=>`<tr><td><b>${e.n}</b></td><td>${e.r}</td><td>${e.d}</td><td><span class="tag ${e.c==='Boshqaruv'?'':e.c==='Mutaxassis'?'b':'o'}">${e.c}</span></td><td>${e.ph}</td><td>${e.dt}</td></tr>`).join(''):'<tr><td colspan=6 class="empty">Hech narsa topilmadi</td></tr>'};
  es.oninput=draw;ed.onchange=draw;draw()}
 if(path==='/ariza'&&document.getElementById('af')){document.getElementById('af').onsubmit=async e=>{e.preventDefault();const f=e.target,fd=new FormData(f),btn=document.getElementById('asb');
  const c={};['name','birth','phone','email','address','education','vacancy','experience','lastJob','salary','about'].forEach(k=>c[k]=(fd.get(k)||'').toString().trim());
  const file=fd.get('cv');let cv=null;
  if(file&&file.size){if(file.size>5*1024*1024){toast('CV fayli 5 MB dan katta');return}cv={name:file.name,type:file.type,data:await fileB64(file)}}
  btn.disabled=true;btn.style.opacity=.6;
  const id='E'+Date.now().toString(36).toUpperCase();
  const ok=await send({type:'ariza',id,candidate:c,cv});
  btn.disabled=false;btn.style.opacity=1;
  if(!ok){toast("Internet bilan muammo. Qayta urinib ko'ring.");return}
  c.id=id;sessionStorage.setItem('cand',JSON.stringify(c));sessionStorage.setItem('tstart',Date.now());sessionStorage.removeItem('tans');
  const a=store.get('apps',[]);a.unshift({d:Date.now()});store.set('apps',a);
  location.hash='#/test'}}
 if(path==='/test'&&document.getElementById('qbox')){const c=cand();let cur=0;let A=[];try{A=JSON.parse(sessionStorage.getItem('tans'))||[]}catch(e){}
  if(!sessionStorage.getItem('tstart'))sessionStorage.setItem('tstart',Date.now());
  const save=()=>sessionStorage.setItem('tans',JSON.stringify(A));
  const draw=()=>{const q=QUIZ[cur],[uz,ru]=q.t.split('|');
   document.getElementById('qbox').innerHTML=`<div class="qt"><b>${cur+1}. ${uz}</b><small>${ru}</small></div>
    ${q.img?`<img class="qimg" src="img/test/q${String(q.img).padStart(2,'0')}.png" alt="${cur+1}-savol">`:''}
    ${q.seq?`<div class="seq">${q.seq}</div>`:''}
    <div class="opts">${'ABCD'.split('').map((L,i)=>`<button class="opt ${A[cur]===L?'sel':''}" data-l="${L}"><b>${L}</b>${q.o?`<span>${q.o[i]}</span>`:''}</button>`).join('')}</div>`;
   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{A[cur]=b.dataset.l;save();draw();if(cur<QUIZ.length-1)setTimeout(()=>{cur++;draw()},250)});
   document.getElementById('qnav').innerHTML=QUIZ.map((_,i)=>`<button class="${i===cur?'cur':''} ${A[i]?'ans':''}" data-i="${i}">${i+1}</button>`).join('');
   document.querySelectorAll('#qnav button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
   const n=A.filter(Boolean).length;document.getElementById('qcount').textContent=`Javob berildi: ${n} / ${QUIZ.length}`;
   document.getElementById('qprev').style.visibility=cur?'visible':'hidden';
   const nx=document.getElementById('qnext');nx.textContent=cur===QUIZ.length-1?'Testni yakunlash ✓':'Keyingi →'};
  document.getElementById('qprev').onclick=()=>{if(cur>0){cur--;draw()}};
  document.getElementById('qnext').onclick=async e=>{if(cur<QUIZ.length-1){cur++;draw();return}
   const left=QUIZ.length-A.filter(Boolean).length;
   if(left&&!confirm(`${left} ta savolga javob berilmagan. Testni yakunlaysizmi?`))return;
   e.target.disabled=true;e.target.textContent='Yuborilmoqda...';
   const answers=QUIZ.map((_,i)=>A[i]||'');const seconds=Math.round((Date.now()-(+sessionStorage.getItem('tstart')))/1000);
   const ok=await send({type:'test',id:c.id,candidate:c,answers,seconds});
   if(!ok){e.target.disabled=false;e.target.textContent='Qayta yuborish';toast("Internet bilan muammo. Qayta urinib ko'ring.");return}
   store.set('done_'+c.id,true);const t=store.get('tests',[]);t.push(1);store.set('tests',t);
   sessionStorage.removeItem('tans');sessionStorage.removeItem('cand');sessionStorage.removeItem('tstart');location.hash='#/rahmat'};
  draw()}

 if(path==='/profil'){document.getElementById('pf').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);store.set('prof',{e:fd.get('e'),ph:fd.get('ph')});render();toast('Profil saqlandi')}}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){location.hash='#/hodimlar';render()}});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
